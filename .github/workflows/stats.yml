name: Estadísticas del perfil

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml
      - .github/scripts/streak-card.mjs

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_rank=true&custom_title=Estadísticas en GitHub&bg_color=0b0907&title_color=c8a24a&text_color=ede6d8&icon_color=b4232a&hide_border=true&border_radius=6&locale=es
          path: assets/stats/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Tarjeta de lenguajes más usados
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&custom_title=Lenguajes más usados&card_width=300&bg_color=0b0907&title_color=c8a24a&text_color=ede6d8&icon_color=b4232a&hide_border=true&border_radius=6&locale=es
          path: assets/stats/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Tarjeta de racha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/streak-card.mjs "${{ github.repository_owner }}" assets/stats/streak.svg

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Se actualizaron las tarjetas de estadísticas"
          git push
