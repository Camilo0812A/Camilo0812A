<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="st">
<title id="st">Racha de contribuciones: 0 días actuales, 5 días como máximo, 93 contribuciones en total</title>
<style>
.fade{animation:fade .8s ease-out both}.c1{animation-delay:.1s}.c2{animation-delay:.3s}.c3{animation-delay:.5s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ring{stroke-dasharray:226;animation:ring 1.2s .3s ease-out both}
@keyframes ring{from{stroke-dashoffset:226}to{stroke-dashoffset:0}}
.flame{transform-origin:247.5px 38px;animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1)}to{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.fade,.ring,.flame{animation:none}}
</style>
<rect width="495" height="195" rx="6" fill="#0b0907"/>
<line x1="165" y1="40" x2="165" y2="160" stroke="#2a231d" stroke-width="1"/>
<line x1="330" y1="40" x2="330" y2="160" stroke="#2a231d" stroke-width="1"/>

  <g class="fade c1" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif">
    <text x="82.5" y="92" fill="#ede6d8" font-size="26" font-weight="700">93</text>
    <text x="82.5" y="128" fill="#ede6d8" font-size="14" font-weight="600">Contribuciones</text>
    <text x="82.5" y="150" fill="#9a9184" font-size="11.5">desde 19 abr 2025</text>
  </g>
<circle cx="247.5" cy="95" r="36" fill="none" stroke="#2a231d" stroke-width="5"/>
<circle class="ring" cx="247.5" cy="95" r="36" fill="none" stroke="#b4232a" stroke-width="5" transform="rotate(-90 247.5 95)"/>
<path class="flame" d="M247.5 24c4 7 10 11 10 19a10 10 0 0 1-20 0c0-4 2-7 4-9 0 4 2 6 4 6 0-6-1-10 2-16z" fill="#b4232a"/>

  <g class="fade c2" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif">
    <text x="247.5" y="104" fill="#e0575d" font-size="28" font-weight="700">0</text>
    <text x="247.5" y="150" fill="#c8a24a" font-size="14" font-weight="600">Racha actual</text>
    <text x="247.5" y="170" fill="#9a9184" font-size="11.5">Sin racha activa</text>
  </g>

  <g class="fade c3" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif">
    <text x="412.5" y="92" fill="#ede6d8" font-size="26" font-weight="700">5</text>
    <text x="412.5" y="128" fill="#ede6d8" font-size="14" font-weight="600">Racha más larga</text>
    <text x="412.5" y="150" fill="#9a9184" font-size="11.5">19 sep – 23 sep 2026</text>
